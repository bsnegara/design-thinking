  if(!x.mur&&x.att<2){x.st='redo';x.note=L.notes[0];x.rub={mak:0,taj:1,kel:1,qir:1}}else{x.st='ok';x.note='';x.rub=x.mur?{taj:1,kel:1,qir:1}:{mak:1,taj:1,kel:1,qir:1}}
  x.seen=!!x.mur;finishEval(x,true);toast(L.toastFb);view()},6000)}
function simSantri(si,ay,note){setTimeout(()=>{const L=t();S.inbox.push({id:S.nid++,who:S.students[si].n,si,ay,att:2,prevNote:note,st:null,note:'',rub:{},ai:false,own:false,seen:true});addLog('ustadz',S.students[si].n+' '+L.lRev+' ('+L.ayWord+' '+(ay+1)+')');toast(L.toastRev+S.students[si].n);view()},7000)}
function finishEval(x,auto){ // after any assessment
  const L=t();
  x.te=Date.now();
  if(x.mur){ if(x.own&&S.murs[x.mi]) S.murs[x.mi].res={st:x.st,rub:x.rub,note:x.note,b:badgeOf(x)}; if(x.own)addLog('santri',L.lMurEval+': '+x.mn+' ('+(x.st==='ok'?L.okSt:L.redoSt)+')'); }
  else if(x.own){ addLog('ortu',L.lChildEval+': '+(x.st==='ok'?L.okSt:L.redoSt)+' ('+L.ayWord+' '+(x.ay+1)+')'); addLog('santri',L.lGot+': '+(x.st==='ok'?L.okSt:L.redoSt)+' ('+L.ayWord+' '+(x.ay+1)+')');
    if(x.st==='ok'){if(x.ay===1&&x.att>1)S.tasks[3]=true;S.doneAyah[x.ay]=true;S.murs.push({n:'Al-Fatihah '+L.ayWord+' '+(x.ay+1),d:'today_',done:false,ay:x.ay});addLog('santri',L.lMurNew+': Al-Fatihah '+L.ayWord+' '+(x.ay+1))} }
  else if(!x.mur){ const st=S.students[x.si]; if(x.st==='ok'){st.p=Math.min(7,st.p+1);} }
  if(!auto){ addLog('ustadz',L.lEval+' '+x.who+': '+(x.st==='ok'?L.okSt:L.redoSt)); }
}

    const unitOpt=[['MTs',L.unitMTs],['MA',L.unitMA],['Takhassus',L.unitTak]].map(u=>`<option value="${u[0]}">${u[1]}</option>`).join('');
    h=`<h2>${L.users}</h2>
    <div class="card"><h2>${L.addS}</h2><label class="small muted" for="ns">${L.nameLbl}</label><input id="ns" class="txt" type="text" placeholder="${L.demoSantri}"><label class="small muted" for="nu">${L.unitLbl}</label><select id="nu">${unitOpt}</select><div class="btnrow"><button class="pri" data-addsantri>${L.add}</button></div></div>
    <div class="card"><h2>${L.addU}</h2><label class="small muted" for="nust">${L.nameLbl}</label><input id="nust" class="txt" type="text"><div class="btnrow"><button class="pri" data-addust>${L.add}</button></div></div>
    <h2>${L.santriList}</h2><ul class="clean">${S.students.map((x,i)=>`<li style="flex-direction:column;align-items:stretch"><div class="row" style="justify-content:space-between"><div><span class="who">${x.n}</span><div class="small muted">${x.unit||''}</div></div><button data-delsantri="${i}">${L.del}</button></div><label class="small muted" for="as${i}">${L.pembimbing}</label><select id="as${i}" data-assign="${i}"><option value="-1">${L.none}</option>${S.ust.map((u,j)=>`<option value="${j}" ${x.ust===j?'selected':''}>${u.n}</option>`).join('')}</select></li>`).join('')}</ul>
    <h2>${L.ustList}</h2><ul class="clean">${S.ust.map((u,j)=>`<li><span class="who">${u.n}</span><button data-delust="${j}">${L.del}</button></li>`).join('')}</ul>`;
  }
  if(S.tab==='prog'){
    h=`<h2>${L.progT}</h2>
    <div class="card"><div class="row" style="justify-content:space-between"><span>${L.targetTakrar}</span><div class="row"><button data-goal="-1" aria-label="-">−</button><b>${S.cfg.goal}</b><button data-goal="1" aria-label="+">+</button></div></div></div>
    <div class="card"><div class="row" style="justify-content:space-between"><span>${L.aiOn}</span><div class="seg" style="min-width:110px"><button data-tog="ai:1" aria-pressed="${S.cfg.ai}">On</button><button data-tog="ai:0" aria-pressed="${!S.cfg.ai}">Off</button></div></div></div>
    <div class="card"><div class="row" style="justify-content:space-between"><span>${L.streakOn}</span><div class="seg" style="min-width:110px"><button data-tog="streak:1" aria-pressed="${S.cfg.streak}">On</button><button data-tog="streak:0" aria-pressed="${!S.cfg.streak}">Off</button></div></div></div>
    <div class="card"><label class="small muted" for="vf">${L.verifier}</label><select id="vf" data-verifier><option value="">—</option>${S.ust.map(u=>`<option ${S.cfg.verifier===u.n?'selected':''}>${u.n}</option>`).join('')}</select></div>`;
  }
  return h;
}

function viewOrtu(){
  const L=t(); let h='';
  const subs=S.inbox.filter(x=>x.own&&!x.mur).slice().reverse(), last=subs[0];
  if(S.tab==='home'){
    const done=AYAT.filter((_,i)=>ayStat(i)==='ok').length;
    h=`<h2>${L.greetP}</h2><div class="card"><div class="row"><div class="ring" style="--p:${Math.round(done/7*100)}"><span>${done}/7</span></div><div><h2>${L.childT}</h2><div class="small muted">${L.trial} · Al-Fatihah</div></div></div></div>
    <div class="card"><h2>${L.lastSt}</h2>${last?`<div class="small muted">${L.ayWord} ${last.ay+1} · ${L.att}${last.att}</div><div style="margin-top:6px"><span class="tag ${last.st==='ok'?'ok':'warn'}">${last.st==='ok'?L.okSt:last.st?L.redoSt:L.waitSt}</span></div>`:`<div class="small muted">${L.noSub}</div>`}</div>
    ${actCard('ortu')}<div class="card soft small">${L.privNote}</div>`;
  }
  if(S.tab==='riwayat'){
    h=`<h2>${L.histT}</h2>`+(subs.length?`<ul class="clean">${subs.map(x=>`<li style="flex-direction:column;align-items:stretch"><div class="row" style="justify-content:space-between"><div><span class="who">Al-Fatihah ${L.ayWord} ${x.ay+1}</span><div class="small muted">${L.att}${x.att}</div></div><span class="tag ${x.st==='ok'?'ok':'warn'}">${x.st==='ok'?L.okSt:x.st?L.redoSt:L.waitSt}</span></div>${x.st?`<div>${rubChips(x.rub)}</div>${x.note?`<div class="small muted">${L.fb}: ${x.note}</div>`:''}`:''}</li>`).join('')}</ul>`:`<div class="muted">${L.noSub}</div>`)+`<div class="card soft small">${L.privNote}</div>`;
  }
  if(S.tab==='jadwal'){
    h=`<h2>${L.murT}</h2><ul class="clean">${S.murs.map(m=>`<li><div><b>${m.n}</b><div class="small muted">${L[m.d]||m.d}</div></div>${m.done?`<span class="tag">${L.done}</span>`:`<span class="tag warn">${L.waitSt}</span>`}</li>`).join('')}</ul>`;
  }
  return h;
}
function view(){
  const L=t(); $('#appsub').textContent=L.sub+(S.role?' • '+(S.role==='ustadz'?L.roleU:S.role==='admin'?L.roleA:S.role==='ortu'?L.roleP:L.roleS):''); $('#protoTag').textContent=L.tag;
  let h='';
  if(S.role){
    if(S.tab==='tugas')h=tasksView(); else if(S.tab==='atur')h=settingsView(); else h=S.role==='ustadz'?viewUstadz():S.role==='admin'?viewAdmin():S.role==='ortu'?viewOrtu():viewSantri();
  }
  $('#view').innerHTML=h; renderTabs(); onb();
}
function onb(){
  const o=$('#onb'), L=t();
  if(!S.showOnb){o.hidden=true;return}
  o.hidden=false;
  if(!S.role){
    o.innerHTML=`<div class="hero"><h2>${L.roleT}</h2><button class="rolebtn" data-role="santri"><b>${L.roleS}</b><span class="small muted">${L.roleSd}</span></button><button class="rolebtn" data-role="ustadz"><b>${L.roleU}</b><span class="small muted">${L.roleUd}</span></button>${ADMIN()?`<button class="rolebtn" data-role="admin"><b>${L.roleA}</b><span class="small muted">${L.roleAd}</span></button>`:''}${PARENT()?`<button class="rolebtn" data-role="ortu"><b>${L.roleP}</b><span class="small muted">${L.rolePd}</span></button>`:''}</div><div class="row" style="justify-content:flex-end"><button data-lang="${S.lang==='id'?'en':'id'}">${S.lang==='id'?'English':'Indonesia'}</button></div>`;
    return;
  }
  const arr=onbArr(), i=S.onb, s=arr[i], last=i===arr.length-1;
  o.innerHTML=`<div class="steps">${arr.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div><div class="hero"><h2>${s[0]}</h2><div class="muted">${s[1]}</div></div><div class="row" style="justify-content:space-between"><button data-skip>${L.skip}</button><button class="pri" data-next>${last?L.start:L.next}</button></div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const L=t(), D=b.dataset;
  if(D.role){ if(S.role!==D.role){S.role=D.role;S.tab='home';S.onb=0;S.showOnb=!(TK()[0]);stopP()} S.showOnb=S.showOnb&&!TK()[0]; }
  else if(D.tab){S.tab=D.tab;stopP()}
  else if(D.go){S.tab=D.go}
  else if(D.play!==undefined){ if(P.cur===D.play){stopP()} else { const k=D.play; const url=k==='rec'?S.recUrl:(k.startsWith('ref')?AUDIO[S.qari+':'+k.slice(3)]:null); startP(k,url,+D.secs||4,k.startsWith('ref')?S.speed:1); if(k.startsWith('ref')&&S.ayah===1)S.heard=true } }
  else if(D.spd!==undefined){S.speed=+D.spd}
  else if(D.fz!==undefined){S.fz=D.fz;document.documentElement.style.setProperty('--fz',{s:.88,m:1,l:1.22}[D.fz]);S.t7.fz=true}
  else if(D.qari!==undefined){S.qari=+D.qari;stopP();S.t7.qari=true}
  else if('tj' in D){S.tj=!S.tj}
  else if('recstart' in D){recStart();return}
  else if('recstop' in D){recStop();return}
  else if('ai' in D){S.ai[S.ayah]=true}
  else if(D.rub!==undefined){const [i,k,v]=D.rub.split(':');S.inbox[+i].rub[k]=+v}
  else if('fix' in D){S.fixing=true;S.rep=0;S.goal=Math.max(1,S.cfg.goal-1);S.rec='idle';S.recUrl=null;S.recT=0}
  else if(D.ay!==undefined){S.ayah=+D.ay;S.rep=0;S.goal=S.cfg.goal;S.hidden=false;S.fixing=false;stopP();S.rec='idle';S.recUrl=null;S.recT=0}
  else if('hide' in D){S.hidden=!S.hidden}
  else if('rep' in D){S.rep++; toast(L.toastRep)}
  else if('send' in D){
    const prev=ownSub(S.ayah), att=prev?prev.att+1:1, id=S.nid++;
    S.inbox.push({id,t:Date.now(),who:L.trial,si:-1,ay:S.ayah,att,prevNote:prev?prev.note:'',st:null,note:'',rub:{},ai:!!S.ai[S.ayah],own:true,seen:true});
    addLog('ustadz',L.trial+' '+(att>1?L.lRev:L.lSent)+' ('+L.ayWord+' '+(S.ayah+1)+')');
    addLog('ortu',L.lChild+' ('+L.ayWord+' '+(S.ayah+1)+')'); toast(L.toastSent); if(S.ayah===1&&att===1)S.tasks[1]=true;
    S.fixing=false;S.rec='idle';S.recUrl=null;S.recT=0;S.goal=S.cfg.goal;stopP();simUstadz(id)}
  else if(D.mur!==undefined){const m=S.murs[+D.mur];m.done=true;{const id=S.nid++;m.mi=+D.mur;S.inbox.push({id,who:L.trial,si:-1,ay:m.ay!==undefined?m.ay:0,att:1,mur:true,mn:m.n,mi:+D.mur,t:Date.now(),prevNote:'',st:null,note:'',rub:{},ai:false,own:true,seen:true});simUstadz(id)}toast(L.toastDone);addLog('ustadz',L.trial+' '+L.lMur+': '+m.n);addLog('ortu',L.lChildMur+': '+m.n);if(m.ay===1)S.tasks[4]=true}
  else if(D.ev!==undefined){const i=+D.ev,x=S.inbox[i],sel=document.getElementById('nt'+i);x.st=D.st;{const tx=document.getElementById('nx'+i);x.note=[sel?sel.value:'',tx?tx.value.trim():''].filter(Boolean).join('. ')}x.seen=!!x.mur;if(x.mur)S.utasks[6]=true;
    finishEval(x,false);toast(L.toastEval);
    if(D.st==='redo')S.utasks[1]=true; if(D.st==='ok'&&x.att>1)S.utasks[3]=true;
    if(x.own&&x.st==='ok'&&x.ay===1&&x.att>1)S.tasks[3]=true;
    if(!x.own&&!x.mur&&D.st==='redo')simSantri(x.si,x.ay,x.note)}
  else if(D.open!==undefined){const i=+D.open;S.open=S.open===i?-1:i}
  else if('addmur' in D){S.extraMur=true;S.murs.push({n:'Al-Kafirun',d:'extraMur'});addLog('santri',L.lMurTeach+': Al-Kafirun');toast(L.murAdded);S.utasks[4]=true}
  else if('addsantri' in D){const n=(document.getElementById('ns').value||'').trim()||(L.demoSantri+' '+(S.cs+1)),u=document.getElementById('nu').value;S.cs++;S.students.push({n,p:0,s:0,unit:u,ust:-1});S.atasks[1]=true;toast(L.add+': '+n)}
  else if('addust' in D){const n=(document.getElementById('nust').value||'').trim()||(L.roleU+' '+(S.ust.length+1));S.ust.push({n});S.atasks[2]=true;toast(L.add+': '+n)}
  else if(D.delsantri!==undefined){S.students.splice(+D.delsantri,1);S.open=-1}
  else if(D.delust!==undefined){const j=+D.delust;S.ust.splice(j,1);S.students.forEach(x=>{if(x.ust===j)x.ust=-1;else if(x.ust>j)x.ust--});if(S.cfg.verifier&&!S.ust.some(u=>u.n===S.cfg.verifier))S.cfg.verifier=''}
  else if(D.goal!==undefined){S.cfg.goal=Math.min(8,Math.max(1,S.cfg.goal+ +D.goal));S.goal=S.cfg.goal;S.atasks[4]=true}
  else if(D.tog!==undefined){const [k,v]=D.tog.split(':');S.cfg[k]=v==='1';if(k==='ai')S.atasks[4]=true}
  else if(D.lang){const prev=S.lang;S.lang=D.lang; if(S.role&&prev==='id'&&S.lang==='en')S.switched=true; if(S.role&&prev==='en'&&S.lang==='id'&&S.switched)tick(5)}
  else if(D.th){const r=document.documentElement; if(D.th==='auto')delete r.dataset.theme; else r.dataset.theme=D.th}
  else if('next' in D){const arr=onbArr(); if(S.onb<arr.length-1)S.onb++; else {S.showOnb=false;tick(0)}}
  else if('skip' in D){S.showOnb=false}
  else return;
  view();
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset&&el.dataset.assign!==undefined){S.students[+el.dataset.assign].ust=+el.value;if(+el.value>=0)S.atasks[3]=true;view()}
  if(el.dataset&&'verifier' in el.dataset){S.cfg.verifier=el.value;view()}});
document.addEventListener('input',e=>{ if(e.target.id==='arz') document.documentElement.style.setProperty('--ar-size',e.target.value+'px'); });
view();
</script>

</body></html>
